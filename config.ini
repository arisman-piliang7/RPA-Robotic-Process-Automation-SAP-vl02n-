[SAP]
# Nama sistem SAP (sesuai SAP Logon Pad)
system_name = PRD
# Nomor client SAP
client = 300
# Username SAP — JANGAN commit nilai asli ke version control
# Gunakan environment variable SAP_USERNAME sebagai alternatif yang lebih aman
username = USERNAME
# Password SAP — JANGAN simpan di sini. Selalu gunakan environment variable SAP_PASSWORD
# password = (dikosongkan, wajib diset via env var SAP_PASSWORD)
# Bahasa login
language = ID

[FILE]
# Path file Excel/CSV yang berisi daftar nomor LO yang akan dihapus
input_file = data/daftar_lo.xlsx
# Nama sheet di file Excel (kosongkan jika menggunakan CSV)
sheet_name = Sheet1
# Nama kolom yang berisi nomor LO
kolom_nomor_lo = NOMOR_LO
# Path file output log hasil proses
output_file = output/hasil_hapus_lo.xlsx

[SETTINGS]
# Waktu tunggu antar langkah (detik)
delay = 1
# Maksimal percobaan ulang jika gagal
max_retry = 3
# Mode simulasi (True = tidak benar-benar menghapus di SAP, hanya simulasi)
dry_run = False
